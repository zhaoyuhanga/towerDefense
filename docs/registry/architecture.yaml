# Architecture Registry
# Auto-generated from ADRs. Do not edit manually without an ADR.
# Last updated: 2026-06-01

## State Ownership
# Format: state_key → owner (ADR-NNNN)
# Interface: [interface details]

- monster_lifecycle:
    owner: MonsterPool
    adr: ADR-0004
    description: All monster node creation, pooling, and destruction
    interface: MonsterPool.spawn() / MonsterPool.despawn()

- game_phase:
    owner: PhaseManager
    adr: ADR-0006
    description: Current game phase (PREP/BATTLE/PAUSED) — single source of truth
    interface: PhaseManager.current_phase (read-only); transitions via start_wave() / on_wave_ended()

## Interface Contracts
# Format: contract_name → defined_by (ADR-NNNN)
# Signal/Method: [signature]

- monster_spawn:
    defined_by: ADR-0004
    signature: MonsterPool.spawn(type: MonsterType, parent: Node, position: Vector2, data: MonsterData) → Monster
    notes: Returns a setup-ready Monster node; caller must add_child to parent

- monster_despawn:
    defined_by: ADR-0004
    signature: MonsterPool.despawn(monster: Monster) → void
    notes: Idempotent — repeated calls are no-op. Removes from tree, resets, pools. Emits SignalBus.monster_died.

- monster_setup:
    defined_by: ADR-0004
    signature: Monster.setup(data: MonsterData) → void
    notes: Must be idempotent. Called on first creation and every pool re-use.

- monster_reset:
    defined_by: ADR-0004
    signature: Monster.reset() → void
    notes: Must clean up tweens, timers, SignalBus connections, dynamic children, process flags.

- monster_warmup:
    defined_by: ADR-0004
    signature: MonsterPool.warmup(type: MonsterType, count: int) → void
    notes: Pre-allocates monsters off-tree to absorb first-instantiate cost.

- grid_renderer_init:
    defined_by: ADR-0005
    signature: GridRenderer.initialize(board_data: Array) → void
    notes: Full 300-cell set_cell() from BoardGrid data. source_id=0, atlas_coords maps CellState.

- grid_cell_update:
    defined_by: ADR-0005
    signature: GridRenderer.set_cell(Vector2i(col, row), 0, atlas_coords_for_state(new))
    notes: Single-cell incremental update triggered by SignalBus.cell_state_changed.

- phase_start_wave:
    defined_by: ADR-0006
    signature: PhaseManager.start_wave() → void
    notes: PREP → BATTLE transition. Called by InputHandler on "Start" button click.

- phase_end_wave:
    defined_by: ADR-0006
    signature: PhaseManager.on_wave_ended() → void
    notes: BATTLE → PREP transition. Called by WaveSpawner when all monsters dead/breached.

