## API Decisions
# Format: decision → reason (ADR-NNNN)

- monster_pool_autoload:
    decision: MonsterPool as Autoload singleton
    reason: Global access point for spawn/despawn; natural fit for node lifecycle management
    adr: ADR-0004

- monster_abstract_base:
    decision: Monster as @abstract Node2D base class
    reason: Enforces setup/reset contract across all monster types
    adr: ADR-0004

- grid_tilemap_layer:
    decision: TileMapLayer (not deprecated TileMap) for grid rendering
    reason: GPU-batched incremental cell updates; modulate.a for zero-cost phase transitions
    adr: ADR-0005

- grid_single_atlas:
    decision: Single TileSetAtlasSource with atlas_coords encoding CellState
    reason: Idiomatic Godot 4 pattern; simplifies texture management and set_cell() calls
    adr: ADR-0005

- phase_paused_engine:
    decision: Use get_tree().paused = true for PAUSED state (V1.0)
    reason: Auto-freezes all _process/_physics_process/Timer/Tween; UI uses PROCESS_MODE_ALWAYS
    adr: ADR-0006

## Configurable Parameters
# Format: parameter → default (ADR-NNNN)

- max_pooled_per_type:
    default: 50
    type: int
    description: Maximum pooled monsters per MonsterType before queue_free
    adr: ADR-0004

- grid_cols:
    default: 20
    type: int (@export)
    description: Grid column count — must match BoardGrid data layer
    adr: ADR-0005

- grid_rows:
    default: 15
    type: int (@export)
    description: Grid row count — must match BoardGrid data layer
    adr: ADR-0005

- game_initial_phase:
    default: PREP (Phase.PREP = 0)
    type: Phase enum
    description: Initial game phase on scene load — all systems default cache to this value
    adr: ADR-0006

## Rendering Rules
# Format: rule → reason (ADR-NNNN)

- grid_nearest_filter:
    rule: TileSet texture_filter = Nearest
    reason: Prevents tile-border bleed/blur at seams under non-integer scaling
    adr: ADR-0005

- grid_physics_disabled:
    rule: No physics layers on GridRenderer TileMapLayer
    reason: Collision is handled by BoardGrid data layer; physics would be dead weight
    adr: ADR-0005

## Forbidden Patterns
# Format: pattern → reason (ADR-NNNN)

- direct_monster_instantiate_free:
    pattern: Calling instantiate() or queue_free() directly on Monster nodes
    reason: Bypasses pooling; causes GC spikes and frame time jitter
    adr: ADR-0004

- monster_ready_state:
    pattern: Setting re-spawn-dependent state in Monster._ready()
    reason: _ready() does not re-fire on pool re-use; state would not be re-initialized
    adr: ADR-0004

- deprecated_tilemap:
    pattern: Using TileMap node (deprecated since Godot 4.3)
    reason: Must use TileMapLayer — TileMap will not receive future fixes
    adr: ADR-0005

- direct_phase_changed_emit:
    pattern: Emitting SignalBus.phase_changed directly (bypassing PhaseManager._set_phase())
    reason: No transition validation; bypasses illegal-transition guard; inconsistent with single source of truth
    adr: ADR-0006

- input_bypass_priority_chain:
    pattern: Systems calling each other directly for input-triggered actions instead of routing through InputHandler
    reason: Bypasses the priority chain (UI > Tower > Block > Empty); can result in double-processing or wrong-target routing
    adr: ADR-0007
